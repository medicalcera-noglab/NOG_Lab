name: Deploy to Production

on:
  push:
    branches: [main]

# Vercel's native GitHub integration handles the actual deployment.
# This workflow only runs Payload schema migrations ahead of the build.

jobs:
  migrate:
    name: Run migrations
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve platform-specific optional deps
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      # Migrations run against the DIRECT (non-pooled) Neon URL to avoid
      # PgBouncer transaction-mode limits during schema changes.
      - name: Run Payload migrations
        run: npx payload migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
