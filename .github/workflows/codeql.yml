name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Build (required for CodeQL JS/TS analysis)
        run: npm run build
        env:
          # Skip Payload admin build — not needed for static analysis
          PAYLOAD_SECRET: placeholder
          DATABASE_URI: postgresql://localhost/placeholder
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
