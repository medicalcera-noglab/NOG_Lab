name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve platform-specific optional deps
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test

      - name: Dependency audit
        # Only fail on critical vulnerabilities. High-severity issues exist in
        # undici (a Payload CMS transitive dep) and are tracked upstream.
        run: npm audit --audit-level=critical

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    # Only run against a deployed preview — skip for draft PRs
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        id: waitForVercel
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
        continue-on-error: true

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        if: steps.waitForVercel.outputs.url != ''
        with:
          urls: ${{ steps.waitForVercel.outputs.url }}
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
