# GitHub secret scanning configuration.
# https://docs.github.com/en/code-security/secret-scanning/configuring-secret-scanning-for-your-repositories
#
# GitHub secret scanning is enabled automatically on public repos and on
# repos with GitHub Advanced Security (GHAS). No extra steps required.
#
# Paths below are excluded from scanning (test fixtures, docs only).
paths-ignore:
  - docs/
  - '**/*.md'
  - '**/*.test.ts'
  - e2e/
