<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NOG Lab mark — monochrome">
  <!-- Single-colour teal version — for watermarks, emboss, single-ink print -->
  <circle cx="32" cy="32" r="30" fill="#0E6E6E"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#0E6E6E" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Lighter teal satellites (tint of brand teal) -->
  <circle cx="32"   cy="13"   r="5.5" fill="#5AAEAE"/>
  <circle cx="48.5" cy="41.5" r="5.5" fill="#5AAEAE"/>
  <circle cx="15.5" cy="41.5" r="5.5" fill="#5AAEAE"/>
  <!-- Filaments -->
  <line x1="32"  y1="19"   x2="32"   y2="26"   stroke="#5AAEAE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44"  y1="39"   x2="38.5" y2="35"   stroke="#5AAEAE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20"  y1="39"   x2="25.5" y2="35"   stroke="#5AAEAE" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nucleus — deeper teal -->
  <circle cx="32" cy="32" r="7" fill="#064848"/>
</svg>
