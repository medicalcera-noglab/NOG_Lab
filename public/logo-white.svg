<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NOG Lab mark — white/reversed">
  <!-- Reversed white version — for use on dark or teal backgrounds -->
  <!-- Outer ring (low-fill haze for depth) -->
  <circle cx="32" cy="32" r="30" fill="white" fill-opacity="0.12"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="white" stroke-width="2"/>
  <!-- Membrane ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.45"/>
  <!-- Satellites — solid white -->
  <circle cx="32"   cy="13"   r="5.5" fill="white"/>
  <circle cx="48.5" cy="41.5" r="5.5" fill="white"/>
  <circle cx="15.5" cy="41.5" r="5.5" fill="white"/>
  <!-- Filaments -->
  <line x1="32"  y1="19"   x2="32"   y2="26"   stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.50"/>
  <line x1="44"  y1="39"   x2="38.5" y2="35"   stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.50"/>
  <line x1="20"  y1="39"   x2="25.5" y2="35"   stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.50"/>
  <!-- Nucleus — white at high opacity -->
  <circle cx="32" cy="32" r="7" fill="white" fill-opacity="0.90"/>
</svg>
