<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NOG Lab mark">
  <!-- Outer cell body -->
  <circle cx="32" cy="32" r="30" fill="#0E6E6E"/>
  <!-- Cell membrane ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.30"/>
  <!-- Three satellite circles (Nutrition · Oral · Gut) at 120° from top -->
  <!-- top    = 270° → (32, 13) -->
  <!-- bottom-right = 30°  → (48.5, 41.5) -->
  <!-- bottom-left  = 150° → (15.5, 41.5) -->
  <circle cx="32"   cy="13"   r="5.5" fill="white" fill-opacity="0.88"/>
  <circle cx="48.5" cy="41.5" r="5.5" fill="white" fill-opacity="0.88"/>
  <circle cx="15.5" cy="41.5" r="5.5" fill="white" fill-opacity="0.88"/>
  <!-- Connecting filaments -->
  <line x1="32"  y1="19"   x2="32"   y2="26"   stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.38"/>
  <line x1="44"  y1="39"   x2="38.5" y2="35"   stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.38"/>
  <line x1="20"  y1="39"   x2="25.5" y2="35"   stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.38"/>
  <!-- Coral nucleus -->
  <circle cx="32" cy="32" r="7" fill="#E2725B"/>
</svg>
